name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This project (Cognivo) is governed by
            .specify/memory/constitution.md -- read it first and flag any
            change that conflicts with one of its Principles by number.

            Focus on:
            - Constitution compliance (see above)
            - Correctness and potential bugs
            - Security implications
            - Code quality and maintainability

            Note: the PR branch is already checked out in the current
            working directory.

            Use `gh pr comment` for a top-level summary review.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to highlight specific line-level issues.
            Only post GitHub comments -- don't just print review text as a
            chat message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
