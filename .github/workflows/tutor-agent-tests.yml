name: Tutor Agent Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, main]
    paths:
      - "tutor-agent/**"
      - "backend/scripts/check_prompt_versioning.py"
      - ".github/workflows/tutor-agent-tests.yml"

permissions:
  contents: read

jobs:
  tutor-agent-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch base branch for prompt-versioning diff
        # spec 014 research.md §4/§8 -- needed for the version-bump
        # check's `git show origin/<base>:<path>` below.
        run: git fetch --depth=1 origin "${{ github.base_ref }}"

      - name: Check prompt versioning (spec 014 FR-001/FR-002/FR-003/FR-008)
        run: |
          python3 backend/scripts/check_prompt_versioning.py tutor-agent/src \
            --base-ref "origin/${{ github.base_ref }}"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Install tutor-agent dependencies
        working-directory: tutor-agent
        run: uv sync

      # Mirrors grading-agent-tests.yml: this project's second remote
      # A2A service had no CI coverage of its own until this workflow
      # existed -- every prior tutor-agent/ pytest run was local-only.
      # No database/live-API env vars needed: this suite mocks or
      # constructs against fixed local defaults the same way
      # grading-agent/'s suite does (research.md §2 -- tutor-agent/
      # holds no database credentials or state of its own).
      - name: Run tutor-agent's own (independent) pytest suite
        working-directory: tutor-agent
        run: uv run pytest -q
