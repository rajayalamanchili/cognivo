[project]
name = "cognivo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.1.2",
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "google-adk>=2.7.0",
    "langfuse>=4.14.4",
    "litellm>=1.96.2",
    "openinference-instrumentation-google-adk>=0.1.20",
    "pgvector>=0.4.1",
    "protobuf>=6.33.6",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pyjwt>=2.11.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Cookie(...)`-as-default-argument is the
# framework's documented dependency-injection pattern, not the
# mutable-default-argument footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
