# Algebra II content artifact (spec 040, User Story 3 -- pilot proof of
# the full K-12 catalog claim).
#
# Topic order below IS the authored order Topic.order_index is assigned
# from at load time (services/content_artifact/loader.py), same
# prerequisites-before-dependents convention as algebra-1/biology.
subject_id: algebra-2
display_name: Algebra II
content_version: "1.0.0"
# spec 040 Clarifications (2026-10-04): real-world-accurate secondary
# bands (9-10), independent of algebra-1's own compressed 6-8 banding --
# chosen so this subject's standards tags below can cite real
# high-school-strand Common Core codes rather than per-grade ones.
grade_bands: [9, 10]
topics:
  - topic_id: quadratic-equations-and-functions
    display_name: Quadratic Equations and Functions
    grade: 9
    prerequisites: []
    skill_definition:
      summary: >-
        Solve quadratic equations in one variable by factoring,
        completing the square, or the quadratic formula, and graph the
        corresponding parabola.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "A quadratic already in factored form, e.g. solve (x - 2)(x + 5) = 0."
      medium: "A quadratic in standard form solvable by factoring without completing the square, e.g. x^2 + 3x - 10 = 0."
      hard: "A quadratic requiring the quadratic formula or completing the square, with irrational or non-integer roots."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSA-REI.B.4
        title: >-
          Solve quadratic equations in one variable by inspection,
          completing the square, the quadratic formula, and factoring, as
          appropriate to the initial form of the equation.
    career_connection:
      career: Aerospace Engineer
      description: >-
        An object's trajectory under gravity is a quadratic function of
        time -- aerospace engineers solve quadratic equations to predict
        exactly when and where a projectile or returning spacecraft will
        land.

  - topic_id: polynomial-operations
    display_name: Polynomial Operations
    grade: 9
    prerequisites: []
    skill_definition:
      summary: >-
        Add, subtract, and multiply polynomials, and identify a
        polynomial's degree and leading coefficient.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Add or subtract two polynomials with matching-degree terms, e.g. (3x^2 + 2x) + (x^2 - 5x)."
      medium: "Multiply a binomial by a trinomial, e.g. (x + 2)(x^2 - 3x + 1)."
      hard: "Multiply two binomials each raised to a power, e.g. (x + 1)^2 * (x - 3)."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSA-APR.A.1
        title: >-
          Understand that polynomials form a system analogous to the
          integers, namely, they are closed under the operations of
          addition, subtraction, and multiplication; add, subtract, and
          multiply polynomials.
    career_connection:
      career: Industrial Engineer
      description: >-
        Industrial engineers model production cost and output as
        polynomial functions of quantity -- combining several such
        polynomials (for materials, labor, and overhead) requires the
        same addition/multiplication rules this topic covers.

  - topic_id: factoring-polynomials
    display_name: Factoring Polynomials
    grade: 9
    prerequisites: [polynomial-operations]
    # Opts into step-by-step grading (spec 018), same rationale as
    # algebra-1's solving-multi-step-equations: factoring has a
    # naturally ordered sequence of steps where naming the first wrong
    # one is more useful than one undifferentiated "incorrect."
    process_level_grading: true
    skill_definition:
      summary: >-
        Factor a quadratic or higher-degree polynomial to reveal its
        zeros, including by grouping and recognizing special patterns
        (difference of squares, perfect-square trinomials).
      # multi_step first, matching algebra-1's solving-multi-step-
      # equations precedent: this is the one topic in this subject
      # whose entry is a multi_step question, not numeric.
      preferred_question_types: [multi_step, numeric]
    difficulty_calibration:
      easy: "A difference-of-squares binomial, e.g. x^2 - 16."
      medium: "A quadratic trinomial with a leading coefficient of 1, e.g. x^2 + 7x + 12."
      hard: "A quadratic trinomial with a leading coefficient other than 1, requiring factoring by grouping."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSA-SSE.B.3A
        title: "Factor a quadratic expression to reveal the zeros of the function it defines."
    career_connection:
      career: Cryptographer
      description: >-
        Modern encryption (RSA) depends on the fact that factoring a
        large number into its prime components is computationally hard --
        cryptographers build and break codes around exactly this
        factoring difficulty.

  - topic_id: rational-expressions-and-equations
    display_name: Rational Expressions and Equations
    # grade 9, same grade as its prerequisite (factoring-polynomials):
    # `grade_entry_topics()` (agents/diagnostic/agent.py) treats a topic
    # as placement-eligible whenever every prerequisite is in a
    # *strictly lower* grade -- a same-grade prerequisite is what keeps
    # a topic out of placement (algebra-1's graphing-linear-equations
    # precedent relies on the identical same-grade rule, not merely
    # "has a prerequisite"). Deliberate here since preferred_question_types
    # is free_text only.
    grade: 9
    prerequisites: [factoring-polynomials]
    skill_definition:
      summary: >-
        Simplify rational expressions by factoring, and solve rational
        equations while checking for extraneous solutions.
      preferred_question_types: [free_text]
    difficulty_calibration:
      easy: "Simplify a rational expression with a common monomial factor, e.g. (4x^2)/(2x)."
      medium: "Simplify a rational expression requiring factoring the numerator or denominator first."
      hard: "Solve a rational equation with variables in two denominators, checking for an extraneous solution."
    misconceptions:
      - misconception_id: cancels-terms-instead-of-factors
        description: >-
          Cancels an individual term across a sum instead of a shared
          factor across the whole numerator and denominator, e.g.
          treating (x + 3)/(x) as simplifying to 1 + 3.
      - misconception_id: skips-extraneous-solution-check
        description: >-
          Solves a rational equation algebraically but never checks
          whether a solution makes an original denominator zero, missing
          an extraneous root.
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSA-REI.A.2
        title: >-
          Solve simple rational and radical equations in one variable,
          and give examples showing how extraneous solutions may arise.
    career_connection:
      career: Chemical Engineer
      description: >-
        Dilution and reaction-rate formulas are rational expressions in
        concentration and volume -- chemical engineers simplify and solve
        them constantly when scaling a reaction from a lab sample to a
        full production batch.

  - topic_id: radical-expressions-and-equations
    display_name: Radical Expressions and Equations
    grade: 10
    prerequisites: [quadratic-equations-and-functions]
    skill_definition:
      summary: >-
        Simplify radical expressions using properties of exponents, and
        solve equations containing a single radical term.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Simplify a radical with a perfect-square factor, e.g. sqrt(50)."
      medium: "Simplify a radical expression with a rational exponent, e.g. 8^(2/3)."
      hard: "Solve an equation with a single radical term, e.g. sqrt(2x + 3) = 5."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSN-RN.A.2
        title: >-
          Rewrite expressions involving radicals and rational exponents
          using the properties of exponents.
    career_connection:
      career: Architect
      description: >-
        The length of a diagonal brace or a roof's rafter is found with
        the Pythagorean theorem, which leaves a radical expression an
        architect must simplify to get a buildable, exact measurement.

  - topic_id: exponential-functions
    display_name: Exponential Functions
    grade: 10
    prerequisites: []
    skill_definition:
      summary: >-
        Construct and evaluate exponential growth and decay functions
        from a rate, an initial value, or two input-output pairs.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Evaluate an exponential function at a given input, e.g. f(x) = 100(1.05)^x at x = 2."
      medium: "Construct an exponential function from a stated growth rate and initial value."
      hard: "Construct an exponential function from two given input-output pairs."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSF-LE.A.2
        title: >-
          Construct linear and exponential functions, including
          arithmetic and geometric sequences, given a graph, a
          description of a relationship, or two input-output pairs
          (include reading these from a table).
    career_connection:
      career: Microbiologist
      description: >-
        Bacterial population growth under ideal conditions is exactly
        exponential -- microbiologists use exponential functions to
        predict how large a culture will be after a given number of
        doubling periods.

  - topic_id: logarithmic-functions
    display_name: Logarithmic Functions
    grade: 10
    prerequisites: [exponential-functions]
    skill_definition:
      summary: >-
        Evaluate logarithms and use them to solve exponential equations
        for an unknown exponent.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Evaluate a common logarithm with an exact integer answer, e.g. log(100)."
      medium: "Solve an exponential equation for the exponent using a logarithm, e.g. 2^x = 50."
      hard: "Solve an exponential growth/decay model for elapsed time given a target value."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSF-LE.A.4
        title: >-
          For exponential models, express as a logarithm the solution to
          ab^(ct) = d where a, c, and d are numbers and the base b is 2,
          10, or e; evaluate the logarithm using technology.
    career_connection:
      career: Seismologist
      description: >-
        Earthquake magnitude on the Richter scale is a base-10 logarithm
        of shaking amplitude -- seismologists use logarithms to compare
        earthquakes whose raw amplitudes differ by factors of thousands.

  - topic_id: sequences-and-series
    display_name: Sequences and Series
    grade: 10
    prerequisites: []
    skill_definition:
      summary: >-
        Write arithmetic and geometric sequences recursively and
        explicitly, and compute the sum of a finite series.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Find the next term of an arithmetic or geometric sequence given its first few terms."
      medium: "Write an explicit formula for the nth term of a given arithmetic or geometric sequence."
      hard: "Compute the sum of a finite arithmetic or geometric series given its first term, common difference/ratio, and number of terms."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.HSF-BF.A.2
        title: >-
          Write arithmetic and geometric sequences both recursively and
          with an explicit formula, use them to model situations, and
          translate between the two forms.
    career_connection:
      career: Actuary
      description: >-
        A loan's monthly payments or an annuity's payout schedule is a
        series -- actuaries sum these series to compute the total value
        of a stream of payments over time.
