# Algebra I content artifact (Milestone 1, User Story 1/2).
#
# Topic order below IS the authored order Topic.order_index is assigned
# from at load time (services/content_artifact/loader.py) -- it's the
# deterministic tiebreaker the Sequencing Agent's next-topic selection
# uses (FR-006), so topics are listed in the order a learner would
# naturally progress through them, prerequisites before dependents.
subject_id: algebra-1
display_name: Algebra I
content_version: "1.0.0"
# spec 017 (grade-banded curriculum scoping): every topic below declares
# a grade referencing one of these bands -- all-or-nothing per subject
# (research.md Decision 1). biology's content artifact is deliberately
# left without grade_bands as the SC-005 ungraded-subject regression
# fixture.
grade_bands: [6, 7, 8]
topics:
  - topic_id: integers-and-operations
    display_name: Integers and Operations
    grade: 6
    prerequisites: []
    skill_definition:
      summary: >-
        Add, subtract, multiply, and divide positive and negative
        integers.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Single-operation problems with small integers, e.g. -3 + 7."
      medium: "Two-step integer arithmetic mixing operations and signs, e.g. -4 * (2 - 5)."
      hard: "Multi-step integer arithmetic with nested parentheses and larger magnitudes."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.7.NS.A.1
        title: >-
          Apply and extend previous understandings of addition and
          subtraction to add and subtract rational numbers; represent
          addition and subtraction on a horizontal or vertical number
          line diagram.
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.7.NS.A.2
        title: >-
          Apply and extend previous understandings of multiplication and
          division and of fractions to multiply and divide rational
          numbers.
    career_connection:
      career: Accountant
      description: >-
        Accountants add and subtract positive and negative integers
        constantly -- a negative balance represents a debit, and getting
        the sign wrong on a transaction throws off an entire ledger.

  - topic_id: variables-and-expressions
    display_name: Variables and Expressions
    grade: 6
    prerequisites: []
    skill_definition:
      summary: >-
        Evaluate and simplify algebraic expressions containing one
        variable, including combining like terms.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "Evaluate a one-variable expression like 3x + 2 for a given x."
      medium: "Simplify an expression by combining like terms across 2-3 terms."
      hard: "Simplify a multi-term expression requiring the distributive property first."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.6.EE.A.3
        title: >-
          Apply the properties of operations to generate equivalent
          expressions.
    career_connection:
      career: Software Engineer
      description: >-
        Variables and expressions are the basic building blocks of every
        programming language -- a variable holds a value, and an
        expression combines variables to compute a new one, exactly like
        a line of code.

  - topic_id: order-of-operations
    display_name: Order of Operations
    grade: 7
    prerequisites: [integers-and-operations]
    skill_definition:
      summary: >-
        Apply the standard order of operations (parentheses, exponents,
        multiplication/division, addition/subtraction) to evaluate
        numeric expressions.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "A two-operation expression with no parentheses, e.g. 4 + 3 * 2."
      medium: "An expression combining parentheses and exponents, e.g. (2 + 3)^2 - 4."
      hard: "A nested expression mixing all four operation tiers."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.6.EE.A.1
        title: "Write and evaluate numerical expressions involving whole-number exponents."
    career_connection:
      career: Pharmacist
      description: >-
        Pharmacists calculate medication doses using multi-part formulas
        involving a patient's weight, concentration, and frequency --
        applying the steps in the wrong order can mean a dangerously
        wrong dose.

  - topic_id: solving-one-step-equations
    display_name: Solving One-Step Equations
    # grade 6, same as its prerequisite (variables-and-expressions): its
    # preferred_question_types is numeric-only, and every OTHER grade's
    # entry topic across this subject is multiple_choice -- keeping
    # every grade-entry topic multiple_choice keeps this fixture simple
    # for tests that mock question generation with a fixed shape.
    grade: 6
    prerequisites: [variables-and-expressions]
    skill_definition:
      summary: >-
        Solve linear equations that require exactly one inverse
        operation to isolate the variable, e.g. x + 5 = 12.
      preferred_question_types: [numeric]
    difficulty_calibration:
      easy: "A one-step equation with positive integer coefficients, e.g. x + 4 = 10."
      medium: "A one-step equation involving a negative coefficient or fraction."
      hard: "A one-step equation requiring division by a non-integer coefficient."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.6.EE.B.7
        title: >-
          Solve real-world and mathematical problems by writing and
          solving equations of the form x + p = q and px = q.
    career_connection:
      career: Electrician
      description: >-
        Ohm's law (V = IR) is a one-step equation -- electricians solve
        it constantly to find the voltage, current, or resistance in a
        circuit when the other two values are known.

  - topic_id: solving-multi-step-equations
    display_name: Solving Multi-Step Equations
    grade: 7
    prerequisites: [solving-one-step-equations, order-of-operations]
    # spec 018 (process-level STEM grading): opts this topic into step-
    # by-step grading -- a naturally multi-step topic where naming the
    # first wrong step (rather than one undifferentiated "incorrect")
    # is actually useful to a learner.
    process_level_grading: true
    skill_definition:
      summary: >-
        Solve linear equations requiring two or more steps, including
        combining like terms and the distributive property.
      # multi_step first: next-question's `preferred_question_type()`
      # (sequencing/agent.py) only ever consults the first entry -- this
      # topic is the one place in this content artifact that entry is
      # actually a multi_step question, not numeric (spec 018).
      preferred_question_types: [multi_step, numeric]
    difficulty_calibration:
      easy: "A two-step equation, e.g. 2x + 3 = 11."
      medium: "A multi-step equation with variables on one side requiring distribution first."
      hard: "A multi-step equation with variables on both sides."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.8.EE.C.7.B
        title: >-
          Solve linear equations with rational number coefficients,
          including equations whose solutions require expanding
          expressions using the distributive property and collecting
          like terms.
    career_connection:
      career: Civil Engineer
      description: >-
        Civil engineers solve multi-step equations to calculate load
        limits on structures like bridges and beams, combining several
        known forces and material properties to find a single unknown.

  - topic_id: linear-inequalities
    display_name: Linear Inequalities
    grade: 7
    prerequisites: [solving-one-step-equations]
    skill_definition:
      summary: >-
        Solve and interpret one-variable linear inequalities, including
        sign-flip on multiplication/division by a negative number.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "A one-step inequality with a positive coefficient, e.g. x + 3 > 7."
      medium: "A two-step inequality requiring one inverse operation with a negative coefficient."
      hard: "A multi-step inequality combining like terms before isolating the variable."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.7.EE.B.4.B
        title: >-
          Solve word problems leading to inequalities of the form
          px + q > r or px + q < r, and graph the solution set of the
          inequality.
    career_connection:
      career: Financial Analyst
      description: >-
        Budgets are built from inequalities -- a financial analyst
        writes "spending must stay under this amount" as a linear
        inequality, then solves it to find the range of affordable
        options.

  - topic_id: graphing-linear-equations
    display_name: Graphing Linear Equations
    # grade 7, not 8: its only prerequisite (solving-multi-step-equations)
    # is also grade 7, so it is never a grade-entry topic (research.md
    # Decision 2) -- deliberate. Its preferred_question_types is
    # free_text only, which placement's grading path (grade_answer,
    # services/mastery/grading.py) does not support; a free_text topic
    # must never be the sole/only entry point for a grade band.
    grade: 7
    prerequisites: [solving-multi-step-equations]
    skill_definition:
      summary: >-
        Identify slope and y-intercept from a linear equation and
        determine points that lie on its graph.
      preferred_question_types: [free_text]
    difficulty_calibration:
      easy: "Identify the slope and y-intercept of an equation already in y = mx + b form."
      medium: "Determine whether a given point lies on the line described by an equation."
      hard: "Convert an equation from standard form to slope-intercept form, then identify slope."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.8.EE.B.6
        title: >-
          Derive the equation y = mx for a line through the origin and
          the equation y = mx + b for a line intercepting the vertical
          axis at b.
    misconceptions:
      - misconception_id: swaps-slope-and-y-intercept
        description: >-
          Consistently swaps which value in y = mx + b is the slope and
          which is the y-intercept (e.g. reports b as the slope).
      - misconception_id: treats-y-intercept-as-x-value
        description: >-
          Treats the y-intercept as an x-coordinate, plotting or
          reporting the line's starting point on the wrong axis.
    career_connection:
      career: Economist
      description: >-
        Economists graph linear supply and demand curves, where the
        slope represents the rate at which price changes as quantity
        changes, and the y-intercept is the starting price or cost.

  - topic_id: systems-of-linear-equations
    display_name: Systems of Linear Equations
    grade: 8
    prerequisites: [graphing-linear-equations, linear-inequalities]
    skill_definition:
      summary: >-
        Solve a system of two linear equations by substitution or
        elimination.
      preferred_question_types: [multiple_choice, numeric]
    difficulty_calibration:
      easy: "A system where one equation is already solved for a variable."
      medium: "A system solvable by straightforward elimination with matching coefficients."
      hard: "A system requiring scaling one or both equations before elimination."
    standards:
      - framework: Common Core Math
        code: CCSS.MATH.CONTENT.8.EE.C.8.B
        title: >-
          Solve systems of two linear equations in two variables
          algebraically, and estimate solutions by graphing the
          equations.
    # Milestone 10 (spec 003): this topic's first preferred_question_type
    # is multiple_choice, satisfying FR-004's structured-question
    # requirement for image-bearing topics.
    image_asset:
      filename: systems-of-equations-graph.svg
      alt_text: >-
        A coordinate plane showing two intersecting lines, y = x + 1 and
        y = -x + 5, crossing at the point (2, 3), which is the system's
        solution.
    career_connection:
      career: Chemist
      description: >-
        Chemists solve systems of equations to figure out how much of
        two different solutions to combine to reach a target
        concentration or volume, where each equation represents one
        known constraint.
