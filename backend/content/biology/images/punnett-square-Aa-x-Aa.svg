<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="A 2x2 Punnett square for a cross between two Aa parents, showing AA, Aa, Aa, and aa in its four cells">
  <rect width="300" height="300" fill="#ffffff" />
  <!-- parent allele labels -->
  <text x="110" y="30" font-size="20" fill="#333333">A</text>
  <text x="190" y="30" font-size="20" fill="#333333">a</text>
  <text x="55" y="110" font-size="20" fill="#333333">A</text>
  <text x="55" y="190" font-size="20" fill="#333333">a</text>
  <!-- grid -->
  <rect x="70" y="60" width="220" height="220" fill="none" stroke="#333333" stroke-width="2" />
  <line x1="180" y1="60" x2="180" y2="280" stroke="#333333" stroke-width="2" />
  <line x1="70" y1="170" x2="290" y2="170" stroke="#333333" stroke-width="2" />
  <!-- offspring genotypes -->
  <text x="115" y="125" font-size="22" fill="#2563eb">AA</text>
  <text x="215" y="125" font-size="22" fill="#16a34a">Aa</text>
  <text x="115" y="235" font-size="22" fill="#16a34a">Aa</text>
  <text x="215" y="235" font-size="22" fill="#dc2626">aa</text>
</svg>
